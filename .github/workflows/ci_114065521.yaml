name: CI Pipeline

on:
  push:
    branches:
            - "**"

permissions:
  contents: read
  checks: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Prettier Check
        run: npm run format

      - name: Run Tests
        run: npm test -- --coverage

      # Upload structured test report
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Tests
          path: test-results.xml
          reporter: jest-junit

      # 📌 Clean CI Summary (IMPORTANT)
      - name: Write CI Summary
        if: always()
        run: |
          echo "## 🧪 CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY || echo "No coverage file found" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Report Location" >> $GITHUB_STEP_SUMMARY
          echo "See 'Tests' tab above for detailed results." >> $GITHUB_STEP_SUMMARY