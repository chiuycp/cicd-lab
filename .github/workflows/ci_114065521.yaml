name: CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 【關鍵設定】：dorny/test-reporter 需要寫入 checks 的權限才能在 UI 顯示報告
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 請替換成你專案使用的 Node 版本

      - name: Install dependencies
        run: npm ci # 在 CI 環境中建議使用 npm ci 確保依賴版本與 package-lock.json 完全一致

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test:ci

      # 【關鍵設定】：使用 dorny/test-reporter 顯示測試結果
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure() # 確保即使前面的測試失敗 (failure)，這個步驟依然會執行來產出報告
        with:
          name: Jest Test Results # 顯示在 GitHub 上的報告標題
          path: test-results.xml # 剛剛在 package.json 設定的報告輸出路徑
          reporter: jest-junit # 指定解析格式
