name: CI Pipeline

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  checks: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Prettier Check
        run: npm run format

      - name: Run Tests
        run: npm test

      # detailed checks
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Tests
          path: test-results.json
          reporter: vitest-json

      # Workflow 主頁 Summary
      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## Vitest Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL=$(cat test-results.json | jq '.numTotalTests')
          PASSED=$(cat test-results.json | jq '.numPassedTests')
          FAILED=$(cat test-results.json | jq '.numFailedTests')
          DURATION=$(cat test-results.json | jq '.testResults | map(.endTime - .startTime) | add')

          echo "| Metric | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | ✅ $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ❌ $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration | ${DURATION}ms |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" -ne 0 ]; then
            echo "## ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY

            cat test-results.json \
              | jq -r '
                .testResults[]
                | select(.status=="failed")
                | "- " + .name
              ' >> $GITHUB_STEP_SUMMARY
          fi